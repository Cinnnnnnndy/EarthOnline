const map = L.map('map', { zoomControl: true }).setView([64.1, -19.5], 5);
const amap = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: ['1','2','3','4'], maxZoom: 18, attribution: '© 高德地图'
});
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18, attribution: '© Esri World Imagery'
});
amap.addTo(map);
map.createPane('land'); map.getPane('land').style.zIndex=150;
window.addEventListener('resize',()=>map.invalidateSize());
document.querySelectorAll('input[name="base"]').forEach(radio => {
  radio.addEventListener('change', e => {
    if (e.target.value === 'amap') { map.removeLayer(esri); amap.addTo(map); }
    else { map.removeLayer(amap); esri.addTo(map); }
  });
});

function makeIcon(color, num) {
  return L.divIcon({ className:'', html:`<div class="marker-num" style="background:${color};">${num}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
}
function makeHotelIcon() {
  return L.divIcon({ className:'', html:`<div class="marker-hotel"><span>H</span></div>`, iconSize:[32,32], iconAnchor:[16,32] });
}
function makeFerryIcon() {
  return L.divIcon({ className:'', html:`<div class="marker-ferry"><span>⚓</span></div>`, iconSize:[32,32], iconAnchor:[16,32] });
}
function makeAirportIcon() {
  return L.divIcon({ className:'', html:`<div class="marker-airport"><span>✈</span></div>`, iconSize:[32,32], iconAnchor:[16,32] });
}

function midpoint(a, b) { return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }

// ============ 绘制每日图层 ============
const layerGroups = {};
const markers = {};
const legLabelLayers = {};
const stopLabelLayers = {};

Object.entries(routes).forEach(([day, route]) => {
  const g = L.layerGroup();
  const legLayer = L.layerGroup();
  const stopLayer = L.layerGroup();
  const ms = [];
  const osrmLegs = OSRM[day] || [];
  osrmLegs.forEach(leg => {
    const style = (leg.mode === 'ferry') ? { color: route.color, weight: 4, opacity: 0.9, dashArray: '8,8' }
               : (leg.mode === 'flight') ? { color: route.color, weight: 3, opacity: 0.7, dashArray: '4,6' }
               : { color: route.color, weight: 4, opacity: 0.9 };
    L.polyline(leg.coords, style).addTo(g);
  });

  route.stops.forEach((s, idx) => {
    const icon = s.isHotel ? makeHotelIcon() : (s.isAirport ? makeAirportIcon() : (s.isFerry ? makeFerryIcon() : makeIcon(route.color, s.n)));
    const titleColor = s.isHotel ? '#8B4513' : (s.isAirport ? '#34495e' : (s.isFerry ? '#16a085' : route.color));
    const titlePrefix = s.isHotel ? '🏨 ' : (s.isAirport ? '✈ ' : (s.isFerry ? '⚓ ' : (s.n + ' · ')));
    const m = L.marker([s.lat, s.lng], { icon, title: s.name })
      .bindPopup(`<b style="color:${titleColor}">${titlePrefix}${s.name}</b><br><span style="font-size:12px;color:#555">${s.desc}</span>` + (s.leg ? `<br><span style="font-size:12px;color:#c0392b">↑ ${s.leg.km} km · ${typeof s.leg.min==='number'?s.leg.min+' min':s.leg.min}</span>` : ''));
    m.addTo(g);
    ms.push(m);

    const stopLbl = L.tooltip({
      permanent: true, direction: 'top',
      offset: [0, (s.isHotel || s.isFerry || s.isAirport) ? -32 : -14],
      className: 'stop-name' + (s.isHotel ? ' hotel' : (s.isFerry ? ' ferry' : (s.isAirport ? ' airport' : ''))),
      opacity: 1,
    }).setLatLng([s.lat, s.lng]).setContent(s.name);
    stopLayer.addLayer(stopLbl);

    if (idx > 0 && s.leg) {
      const osrmLeg = osrmLegs[idx - 1];
      let mid;
      if (osrmLeg && osrmLeg.coords && osrmLeg.coords.length > 2) {
        mid = osrmLeg.coords[Math.floor(osrmLeg.coords.length/2)];
      } else {
        const prev = route.stops[idx - 1];
        mid = midpoint([prev.lat, prev.lng], [s.lat, s.lng]);
      }
      const minTxt = (typeof s.leg.min === 'number') ? s.leg.min + ' min' : s.leg.min;
      const legLbl = L.tooltip({
        permanent: true, direction: 'center',
        className: 'leg-label', opacity: 1,
      }).setLatLng(mid).setContent(`${s.leg.km} km · ${minTxt}`);
      legLayer.addLayer(legLbl);
    }
  });

  layerGroups[day] = g;
  markers[day] = ms;
  legLabelLayers[day] = legLayer;
  stopLabelLayers[day] = stopLayer;
});

// ============ 生成侧边栏 tabs + day-info ============
const tabsEl = document.getElementById('tabs');
const infoEl = document.getElementById('dayInfoContainer');

function totalMeta(route) {
  let totalKm = 0, totalMin = 0;
  route.stops.forEach(s => {
    if (!s.leg) return;
    if (typeof s.leg.km === 'number') totalKm += s.leg.km;
    if (typeof s.leg.min === 'number') totalMin += s.leg.min;
    else if (typeof s.leg.min === 'string') {
      const m = s.leg.min.match(/(\d+)h(\d+)?/);
      if (m) totalMin += parseInt(m[1])*60 + (parseInt(m[2])||0);
      else { const n = parseInt(s.leg.min); if(!isNaN(n)) totalMin += n; }
    }
  });
  const h = Math.floor(totalMin/60), mm = totalMin%60;
  const t = h>0 ? `${h}h${mm.toString().padStart(2,'0')}` : `${mm} min`;
  return { km: totalKm.toFixed(1), t };
}

  info.dataset.plan = route.plan;

  info.innerHTML = `<h2>Day ${route.day} · ${route.date} · ${route.title}</h2>
    <div class="meta"><b>合计</b>：${meta.km} km / ${meta.t}（不含停留）</div>
    <ol class="stops c-${route.color.replace('#','')}" id="stops-${day}"></ol>`;
  infoEl.appendChild(info);

  const ol = info.querySelector(`#stops-${day}`);
  route.stops.forEach((s, idx) => {
    const li = document.createElement('li');
    let legHtml = '';
    if (s.leg) {
      const minTxt = (typeof s.leg.min === 'number') ? s.leg.min + ' min' : s.leg.min;
      legHtml = `<div class="leg">↑ ${s.leg.km} km · ${minTxt}</div>`;
    }
    li.innerHTML = `<div class="n">${s.name}</div><div class="d">${s.desc}</div>${legHtml}`;

});

function renderLegend(plan) {
  const items = [];
  items.push('<b>图例：</b><br>');
  items.push('<div class="item"><span class="dot" style="background:#8B4513;"></span>酒店</div>');
  items.push('<div class="item"><span class="dot" style="background:#34495e;"></span>机场</div>');
  items.push('<div class="item"><span class="dot" style="background:#16a085;"></span>邮轮码头</div>');
  Object.entries(routes).filter(([d,r]) => r.plan === plan).forEach(([day, route]) => {
    items.push(`<div class="item"><span class="dot" style="background:${route.color};"></span>D${route.day} ${route.title.split('·')[0].trim()}</div>`);
  });

  legendEl.innerHTML = items.join('');
}

// ============ 方案切换 ============
let currentPlan = 1;
let currentDay = 'all';
let labelsOn = true;

function applyLabels(day) {
  Object.values(legLabelLayers).forEach(l => map.removeLayer(l));
  Object.values(stopLabelLayers).forEach(l => map.removeLayer(l));
  if (!labelsOn) return;
  if (day === 'all') {
    Object.entries(legLabelLayers).forEach(([d, l]) => {
      if (routes[d].plan === currentPlan) l.addTo(map);
    });
    Object.entries(stopLabelLayers).forEach(([d, l]) => {
      if (routes[d].plan === currentPlan) l.addTo(map);
    });
  } else {
    legLabelLayers[day].addTo(map);
    stopLabelLayers[day].addTo(map);
  }
}

function showDay(day) {
  currentDay = day;
  Object.values(layerGroups).forEach(g => map.removeLayer(g));

  const daysInPlan = Object.entries(routes).filter(([d,r]) => r.plan === currentPlan).map(([d,r]) => d);

  if (day === 'all') {
    daysInPlan.forEach(d => layerGroups[d].addTo(map));
    const groups = daysInPlan.map(d => layerGroups[d].getLayers()).flat();
    if (groups.length) {
      map.fitBounds(L.featureGroup(groups).getBounds(), { padding:[40,40] });
    }
  } else {
    layerGroups[day].addTo(map);
    map.fitBounds(L.featureGroup(layerGroups[day].getLayers()).getBounds(), { padding:[40,40] });
  }
  applyLabels(day);

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.day === day));
  document.querySelectorAll('.day-info').forEach(d => d.classList.toggle('active', d.dataset.day === day && parseInt(d.dataset.plan) === currentPlan));
  if (day === 'all') {
    const firstDay = daysInPlan[0];
    document.querySelector(`.day-info[data-day="${firstDay}"]`)?.classList.add('active');
  }
}

function switchPlan(plan) {
  currentPlan = plan;
  document.querySelectorAll('.plan-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.plan) === plan));
  // 显示/隐藏 tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('visible', parseInt(t.dataset.plan) === plan);
  });
  // 添加 "全部" tab (第一个) 若尚未存在
  const subEl = document.getElementById('planSub');
  if (plan === 1) {
    subEl.innerHTML = '<b>方案 1</b>：冰岛 6 天自驾 + 挪威邮轮/罗弗敦 3 天 · 2026-09-26 ~ 10-02（D2-D8）';
  } else {
    subEl.innerHTML = '<b>方案 2</b>：冰岛 + 哥本哈根 + 卑尔根 + 特罗姆瑟 + 罗弗敦 + 奥斯陆 · 2026-09-26 ~ 10-06（D2-D12）';
  }
  renderLegend(plan);
  // 默认展示第一天
  const firstDay = Object.entries(routes).find(([d,r]) => r.plan === plan)[0];
  showDay(firstDay);
  // fit bounds 到该方案全部
  showDay('all');
}

  t.addEventListener('click', () => showDay(t.dataset.day));
});

document.getElementById('labelToggle').addEventListener('click', () => {
  labelsOn = !labelsOn;
  document.getElementById('labelToggle').textContent = labelsOn ? '🏷️ 隐藏地名/里程' : '🏷️ 显示地名/里程';
  applyLabels(currentDay);
});

// 初始加载方案 1
switchPlan(1);
</script>
